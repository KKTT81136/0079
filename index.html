<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Jackpot & Withdrawal Demo</title>

  <!-- Google Fonts: Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font: 'Kanit', sans-serif;
      --bg: #020812;
      --card1: #0b1b31;
      --card2: #06101f;
      --blue: #1597ff;
      --cyan: #43c8ff;
      --blue2: #0b68d8;
      --text: #eef8ff;
      --sub: #81b8e8;
      --line: rgba(56, 166, 255, .18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 130, 255, .18), transparent 38%),
        radial-gradient(circle at 10% 100%, rgba(0, 80, 255, .10), transparent 35%),
        var(--bg);
      padding: 24px 12px;
      min-height: 100vh;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* =========================================
       CSS: ส่วนที่ 1 - วิดเจ็ตแจ็คพอตรวม
    ========================================= */
    .jr-scope {
      --blue: #168cff;
      --cyan: #41d9ff;
      --deep: #063b79;
      --ink: #06101d;
      --bone: #eef8ff;
      --muted: #9cc9ef;
      width: 100%;
      display: grid;
      place-items: center;
      color: var(--bone);
    }
    .jr-shell {
      width: min(100%, 720px);
      display: grid;
      gap: 10px;
    }
    .jr-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .jr-chip, .jr-tile {
      background: linear-gradient(180deg, rgba(22, 140, 255, .14), rgba(0, 8, 18, .62));
      border: 1px solid rgba(65, 217, 255, .24);
      border-radius: 14px;
      text-align: center;
    }
    .jr-chip {
      padding: 10px 5px;
    }
    .jr-chip-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
    .jr-chip-val, .jr-tile-val {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .jr-chip-val {
      font-size: clamp(1rem, 4vw, 1.35rem);
    }
    .jr-chip-label, .jr-tile-label, .jr-stage-label {
      font-size: .78rem;
      color: var(--muted);
    }
    .jr-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 1.8s infinite;
    }
    .jr-mark {
      color: var(--cyan);
    }
    .jr-card {
      position: relative;
      padding: 22px;
      border-radius: 22px;
      overflow: hidden;
      background: radial-gradient(100% 70% at 50% 0, rgba(22, 140, 255, .28), transparent 62%), linear-gradient(180deg, #07192d, #030912);
      border: 1px solid rgba(65, 217, 255, .25);
      box-shadow: 0 30px 60px -30px #000;
    }
    .jr-card:before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(from 0deg, transparent 0 58%, rgba(65, 217, 255, .55) 64%, transparent 70% 82%, rgba(22, 140, 255, .35) 88%, transparent 92%);
      animation: spin 9s linear infinite;
      filter: blur(10px);
    }
    .jr-card:after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 21px;
      background: linear-gradient(180deg, rgba(4, 17, 32, .32), rgba(2, 7, 13, .8));
      pointer-events: none;
    }
    .jr-eyebrow, .jr-title, .jr-stage, .jr-grid {
      position: relative;
      z-index: 1;
    }
    .jr-eyebrow {
      text-align: center;
      font-size: .75rem;
      letter-spacing: .15em;
      color: var(--muted);
    }
    .jr-eyebrow .jr-dot {
      display: inline-block;
      margin-right: 6px;
    }
    .jr-title {
      font-weight: 700;
      text-align: center;
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      margin: 5px 0 14px;
      background: linear-gradient(#fff, #8fddff);
      -webkit-background-clip: text;
      color: transparent;
    }
    .jr-stage {
      position: relative;
      padding: 18px 8px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(8, 61, 119, .62), rgba(0, 10, 24, .78));
      border: 1px solid rgba(65, 217, 255, .25);
      overflow: hidden;
      cursor: pointer;
      isolation: isolate;
    }
    .jr-stage:before {
      content: "";
      position: absolute;
      width: 72%;
      aspect-ratio: 1;
      border: 1px solid rgba(65, 217, 255, .2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      left: 14%;
      top: 50%;
      transform: translateY(-50%);
      animation: orbit 5s linear infinite;
    }
    .jr-stage:after {
      content: "";
      position: absolute;
      inset: -20%;
      background: conic-gradient(from 90deg, transparent 0 72%, rgba(65, 217, 255, .12) 78%, transparent 84%);
      animation: spin 4s linear infinite;
    }
    .jr-stage-label {
      text-align: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
    }
    .jr-reel {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 3px;
      font: 700 clamp(1.8rem, 9vw, 3.4rem)/1 "Kanit", sans-serif;
    }
    .jr-cur {
      color: var(--cyan);
      align-self: center;
      font-size: .62em;
    }
    .jr-sep {
      display: grid;
      place-items: end center;
      width: .28em;
      color: #9ce8ff;
    }
    .jr-cell {
      width: .68em;
      height: 1.32em;
      overflow: hidden;
      border-radius: 8px;
      background: linear-gradient(#0b396c, #06172c, #0a2e57);
      box-shadow: inset 0 1px #fff2;
    }
    .jr-strip {
      display: block;
      height: 1000%;
      transform: translateY(calc(var(--d, 0) * -10%));
      transition: transform .16s;
    }
    .jr-strip i {
      display: grid;
      place-items: center;
      height: 10%;
      font-style: normal;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 14px rgba(65, 217, 255, .8);
    }
    .jr-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .jr-tile {
      padding: 12px;
      background: linear-gradient(180deg, #ffffff0c, #ffffff03);
    }
    .jr-tile-label {
      margin-bottom: 3px;
    }
    .jr-tile-val {
      font-size: clamp(1.05rem, 4.5vw, 1.4rem);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes orbit {
      to { transform: translateY(-50%) rotate(360deg); }
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px transparent; }
    }

    @media (max-width: 400px) {
      .jr-scope { padding: 8px; }
      .jr-card { padding: 16px; }
      .jr-chip { padding: 9px 3px; }
      .jr-reel { gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .jr-card:before, .jr-stage:before, .jr-stage:after, .jr-dot { animation: none; }
      .jr-strip { transition: none; }
    }

    /* =========================================
       CSS: ส่วนที่ 2 - รายการถอนล่าสุด
    ========================================= */
    .withdraw-wrapper {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    .withdraw-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
      text-shadow: 0 0 18px rgba(32, 167, 255, .6);
    }
    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #25baff;
      box-shadow: 0 0 8px #25baff, 0 0 16px #087fff;
      animation: pulse 1.5s infinite;
    }
    .withdraw-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .withdraw-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 90px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(28, 107, 174, .15), transparent 45%),
        linear-gradient(180deg, var(--card1), var(--card2));
      box-shadow: 0 10px 28px rgba(0, 0, 0, .4), inset 0 1px rgba(255, 255, 255, .05);
      overflow: hidden;
      animation: cardIn .55s cubic-bezier(.2, .8, .2, 1) forwards;
      transition: .3s ease;
    }
    .withdraw-card::before {
      content: "";
      position: absolute;
      left: -80px;
      top: 0;
      width: 60px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(90, 205, 255, .3), transparent);
      transform: skewX(-20deg);
      animation: shine 3.8s infinite;
    }
    .withdraw-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      background: linear-gradient(120deg, transparent 35%, rgba(60, 180, 255, .06), transparent 65%);
    }
    .withdraw-card:hover {
      transform: translateY(-2px) scale(1.005);
      border-color: rgba(53, 178, 255, .42);
      box-shadow: 0 14px 35px rgba(0, 0, 0, .48), 0 0 25px rgba(0, 126, 255, .10);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(-18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shine {
      0%, 55% { left: -100px; }
      75%, 100% { left: 110%; }
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 2;
    }
    .bank-icon-box {
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      border: 2px solid rgba(88, 198, 255, .8);
      box-shadow: 0 0 0 3px rgba(25, 132, 230, .10), 0 0 18px rgba(0, 143, 255, .22);
      transition: .3s ease;
    }
    .bank-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 0;
    }
    .info-row {
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-align: left;
      font-size: 15px;
      line-height: 1.4;
      color: var(--text);
    }
    .font-bold { font-weight: 700; }
    .amount {
      color: #35b8ff;
      text-shadow: 0 0 10px rgba(24, 170, 255, .4);
    }
    .date-row {
      margin-top: 2px;
      color: var(--sub);
      font-size: 11.5px;
      opacity: .9;
    }
    .status-badge {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 108px;
      padding: 7px 14px;
      border-radius: 999px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, .10);
      transition: .35s ease;
      flex-shrink: 0;
    }
    .processing {
      background: linear-gradient(135deg, #075fc5, #0a8de8);
      box-shadow: 0 5px 18px rgba(0, 124, 255, .24);
    }
    .success {
      background: linear-gradient(135deg, #0874e8, #16b4ff);
      box-shadow: 0 5px 20px rgba(0, 153, 255, .28);
      animation: successGlow .8s ease;
    }

    @keyframes successGlow {
      0% { transform: scale(.9); box-shadow: 0 0 0 rgba(0, 174, 255, 0); }
      60% { transform: scale(1.06); box-shadow: 0 0 28px rgba(0, 174, 255, .5); }
      100% { transform: scale(1); box-shadow: 0 5px 20px rgba(0, 153, 255, .28); }
    }

    .badge-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
      display: block;
    }
    .spinner { animation: spin 1s linear infinite; }

    @media (max-width: 576px) {
      .withdraw-header { font-size: 20px; }
      .withdraw-card { min-height: 82px; padding: 12px; gap: 8px; border-radius: 17px; }
      .card-left { gap: 11px; }
      .bank-icon-box { width: 44px; height: 44px; min-width: 44px; }
      .info-row { font-size: 13px; }
      .date-row { font-size: 10px; }
      .status-badge { min-width: 83px; padding: 6px 9px; font-size: 11px; gap: 4px; }
      .badge-icon svg { width: 13px; height: 13px; }
    }
    @media (max-width: 390px) {
      .withdraw-card { align-items: flex-start; }
      .status-badge { min-width: 76px; padding: 6px 7px; }
      .info-row { font-size: 12px; }
    }
  </style>
</head>

<body>

  <!-- ========================================================

  <div class="withdraw-wrapper">
    <div class="withdraw-header">
      <span class="live-dot"></span>

    <div id="withdraw-list" class="withdraw-list"></div>

  <!-- ========================================================
       JAVASCRIPT: ควบคุมการทำงานของทั้ง 2 วิดเจ็ต
  ======================================================== -->
  <script>
  /* ---------- สคริปต์ 1: แจ็คพอตรวม ---------- */
  (() => {
    const nf = new Intl.NumberFormat("th-TH"),
          R = matchMedia("(prefers-reduced-motion:reduce)").matches,
          reel = document.getElementById("jrReel"),
          stage = document.getElementById("jrStage"),
          state = {};
    let cells = [], value = null, raf;

    const ease = t => 1 - Math.pow(1 - t, 4),
          digits = n => String(Math.max(0, Math.round(n))).padStart(cells.length, "0").slice(-cells.length);

    function build(t) {
      reel.innerHTML = '<span class="jr-cur">฿</span>';
      cells = [];
      for (const c of t) {
        if (c === ",") {
          const sep = document.createElement("span");
          sep.className = "jr-sep";
          sep.textContent = ",";
          reel.appendChild(sep);
          continue;
        }
        const cell = document.createElement("span"),
              strip = document.createElement("span");
        cell.className = "jr-cell";
        strip.className = "jr-strip";
        for (let i = 0; i < 10; i++) {
          const x = document.createElement("i");
          x.textContent = i;
          strip.appendChild(x);
        }
        cell.appendChild(strip);
        reel.appendChild(cell);
        cells.push(strip);
      }
    }

    function paint(s) {
      cells.forEach((x, i) => x.style.setProperty("--d", s[i] || 0));
    }

    function spinTo(n) {
      n = Math.max(0, Math.round(n));
      const t = nf.format(n),
            len = t.replace(/,/g, "").length;

      if (len !== cells.length) build(t);

      if (R) {
        paint(digits(n));
        value = n;
        return;
      }

      const from = value ?? Math.floor(n * 0.9),
            start = performance.now(),
            dur = value === null ? 1500 : 900;

      cancelAnimationFrame(raf);
      stage.style.boxShadow = "0 0 45px -8px #168cff";

      (function f(now) {
        const p = Math.min(1, (now - start) / dur);
        paint(digits(from + (n - from) * ease(p)));

        if (p < 1) {
          raf = requestAnimationFrame(f);
        } else {
          value = n;
          stage.style.boxShadow = "";
        }
      })(start);
    }

    function count(el, n) {
      const k = el.dataset.jr,
            from = state[k] ?? Math.floor(n * 0.9),
            pre = el.dataset.prefix || "";

      state[k] = n;

      if (R) {
        el.textContent = pre + nf.format(n);
        return;
      }

      const st = performance.now();
      (function f(now) {
        const p = Math.min(1, (now - st) / 900);
        el.textContent = pre + nf.format(Math.round(from + (n - from) * ease(p)));
        if (p < 1) requestAnimationFrame(f);
      })(st);
    }

    function update(d) {
      document.querySelectorAll("[data-jr]").forEach(e => {
        if (typeof d[e.dataset.jr] === "number") count(e, d[e.dataset.jr]);
      });
      if (typeof d.jackpot === "number") spinTo(d.jackpot);
    }

    let data = {
      online: 385212,
      winnersToday: 10487,
      prizesToday: 1378984,
      jackpot: 9212498,
      recentWinners: 248,
      topPrize: 159168
    };

    function next() {
      data.online = Math.max(0, data.online + (Math.random() < 0.5 ? 1 : -1) * (Math.floor(Math.random() * 41) + 10));
      data.winnersToday += Math.floor(Math.random() * 36) + 5;
      data.prizesToday += Math.floor(Math.random() * 15001) + 5000;
      data.jackpot += Math.floor(Math.random() * 45001) + 5000;
      data.recentWinners += Math.floor(Math.random() * 18) + 3;
      return data;
    }

    build("0");
    update(data);

    setInterval(() => {
      if (!document.hidden) update(next());
    }, 3000);

    stage.onclick = () => {
      if (!R) {
        stage.animate([
          { transform: "scale(1)" },
          { transform: "scale(1.015)" },
          { transform: "scale(1)" }
        ], { duration: 350 });
      }
    };
  })();

  /* ---------- สคริปต์ 2: รายการถอนล่าสุด ---------- */
  (() => {
    const listContainer = document.getElementById('withdraw-list');
    const MAX_ITEMS = 5;
    const ADD_INTERVAL = 3500;
    const PROCESS_TIME_MIN = 2000;
    const PROCESS_TIME_MAX = 5000;

    const BANKS = [
      { name: 'SCB', img: 'https://templat.advlnw.com/template/22/img/banks/scb.webp' },
      { name: 'KBANK', img: 'https://templat.advlnw.com/template/22/img/banks/kbank.webp' },

      { name: 'TTB', img: 'https://templat.advlnw.com/template/22/img/banks/ttb.webp' },
      { name: 'BAY', img: 'https://templat.advlnw.com/template/22/img/banks/bay.webp' },
      { name: 'BBL', img: 'https://templat.advlnw.com/template/22/img/banks/bbl.webp' }

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const fmtMoney = v => v.toLocaleString('th-TH');

    function generateUser() {
      return `cdeexxxx${Math.floor(10000 + Math.random() * 90000)}`;
    }

    function generateDate() {
      return new Date().toLocaleString('th-TH', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
    }

    const checkIcon = `
    <svg viewBox="0 0 24 24">
      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
    </svg>`;

    const spinnerIcon = `
    <svg class="spinner" viewBox="0 0 24 24">
      <path d="M12 4V2C6.48 2 2 6.48 2 12h2c0-4.41 3.59-8 8-8zm0 14c4.41 0 8-3.59 8-8h2c0 5.52-4.48 10-10 10v-2z"/>
    </svg>`;

    function createCard() {
      const bank = BANKS[rand(0, BANKS.length - 1)];
      const amount = rand(500, 50000);
      const card = document.createElement('div');
      card.className = 'withdraw-card';

      card.innerHTML = `
        <div class="card-left">
          <div class="bank-icon-box">
            <img class="bank-img" src="${bank.img}" alt="${bank.name}">
          </div>
          <div class="user-info">
            <div class="info-row font-bold">ยูสเซอร์: ${generateUser()}</div>
            <div class="info-row font-bold">ยอดถอน: <span class="amount">${fmtMoney(amount)}</span> บาท</div>
            <div class="date-row">${generateDate()}</div>
          </div>
        </div>

        <div class="status-badge processing">
          <div class="badge-icon">${spinnerIcon}</div>
          <span>กำลังโอน</span>
        </div>
      `;

      setTimeout(() => {
        const badge = card.querySelector('.status-badge');
        if (badge) {
          badge.className = 'status-badge success';
          badge.innerHTML = `
            <div class="badge-icon">${checkIcon}</div>
            <span>โอนแล้ว</span>`;
        }
      }, rand(PROCESS_TIME_MIN, PROCESS_TIME_MAX));

      return card;
    }

    function addTransaction() {
      listContainer.prepend(createCard());
      while (listContainer.children.length > MAX_ITEMS) {
        listContainer.lastElementChild.remove();
      }
    }

    for (let i = 0; i < MAX_ITEMS; i++) addTransaction();
    setInterval(addTransaction, ADD_INTERVAL);
  })();
  </script>

</body>
</html>
